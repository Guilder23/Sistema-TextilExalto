<aside class="app-sidebar" id="appSidebar">
  <div class="sidebar-section">Principal</div>
  <a class="sidebar-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}" href="{% url 'usuarios:inicio' %}"><i class="bi bi-speedometer2"></i><span>Inicio</span></a>

  <div class="sidebar-section">Inventario</div>

  {% if user.es_admin %}<a class="sidebar-link {% if request.resolver_match.app_name == 'entradas' %}active{% endif %}" href="{% url 'entradas:lista' %}"><i class="bi bi-box-arrow-in-down"></i><span>Entradas</span></a>{% else %}<a class="sidebar-link disabled" href="#"><i class="bi bi-box-arrow-in-down"></i><span>Entradas</span></a>{% endif %}
