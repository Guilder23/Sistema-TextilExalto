{% load static %}
<nav class="app-navbar navbar">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-icon sidebar-toggle" id="btnSidebar" type="button" aria-label="Contraer menú" aria-expanded="true">
        <i class="bi bi-layout-sidebar-inset"></i>
      </button>
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="{% url 'usuarios:inicio' %}">
        <span class="brand-logo"><i class="bi bi-box-seam"></i></span>
        <span class="brand-text">Textil <strong>Exalto</strong></span>
      </a>
    </div>
    <div class="dropdown">
      <a class="user-chip dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar">{{ user.username|slice:":1"|upper }}</span>
        <span class="d-none d-sm-flex flex-column text-start lh-sm">
          <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
          <span class="user-role">{{ user.get_rol_display }}</span>
        </span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0">
        <li><h6 class="dropdown-header">{{ user.username }}</h6></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}
            <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>
