{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Textil Exalto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/registration/login.css' %}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="text-center mb-4">
      <span class="login-logo"><i class="bi bi-box-seam"></i></span>
      <h1 class="login-title">Textil <strong>Exalto</strong></h1>
      <p class="text-muted mb-0">Ingresa a tu cuenta para continuar</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post" id="loginForm" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" autofocus required autocomplete="username">
        <label for="username">Usuario</label>
      </div>
      <div class="input-group mb-4">
        <div class="form-floating flex-grow-1">
          <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required autocomplete="current-password">
          <label for="password">Contraseña</label>
        </div>
        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
      </div>
      <button class="btn btn-primary w-100 py-2" type="submit">Iniciar sesión</button>
    </form>
  </div>
  <script src="{% static 'js/registration/login.js' %}"></script>
</body>
</html>
