<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="post" action="" id="formEditar" novalidate>
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarLabel"><i class="bi bi-pencil-square me-2"></i>Editar categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="editarNombre">Nombre *</label><input class="form-control" id="editarNombre" name="nombre" required maxlength="100"></div>
        <div class="mb-3"><label class="form-label" for="editarDescripcion">Descripción</label><textarea class="form-control" id="editarDescripcion" name="descripcion" rows="3" maxlength="255"></textarea></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="editarActiva" name="activa"><label class="form-check-label" for="editarActiva">Categoría activa</label></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
