<div class="modal fade" id="modalCrear" tabindex="-1" aria-labelledby="modalCrearLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="post" action="{% url 'categorias:crear' %}" id="formCrear" novalidate>
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearLabel"><i class="bi bi-tag me-2"></i>Nueva categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="crearNombre">Nombre *</label><input class="form-control" id="crearNombre" name="nombre" required maxlength="100"></div>
        <div class="mb-3"><label class="form-label" for="crearDescripcion">Descripción</label><textarea class="form-control" id="crearDescripcion" name="descripcion" rows="3" maxlength="255"></textarea></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="crearActiva" name="activa" checked><label class="form-check-label" for="crearActiva">Categoría activa</label></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
      </div>
    </form>
  </div>
</div>
