<div class="modal fade" id="modalCrear" tabindex="-1" aria-labelledby="modalCrearLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" method="post" action="{% url 'entradas:crear' %}" id="formCrear" novalidate>
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearLabel"><i class="bi bi-box-arrow-in-down me-2"></i>Nueva entrada de materiales</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3 mb-4">
          <div class="col-md-3"><label class="form-label" for="crearFecha">Fecha *</label><input type="date" class="form-control" id="crearFecha" name="fecha" value="{{ hoy }}" required></div>
          <div class="col-md-5"><label class="form-label" for="crearProveedor">Proveedor *</label><input class="form-control" id="crearProveedor" name="proveedor" required maxlength="150"></div>
          <div class="col-md-4"><label class="form-label" for="crearDocumento">Factura / guía</label><input class="form-control" id="crearDocumento" name="documento" maxlength="60"></div>
          <div class="col-12"><label class="form-label" for="crearObservaciones">Observaciones</label><textarea class="form-control" id="crearObservaciones" name="observaciones" rows="2"></textarea></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Materiales</h6>
          <button type="button" class="btn btn-sm btn-outline-primary" id="btnAgregarLinea"><i class="bi bi-plus-lg me-1"></i>Agregar material</button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle tabla-lineas mb-0">
            <thead><tr><th style="min-width:260px">Material</th><th style="width:140px">Cantidad</th><th style="width:150px">Costo unitario</th><th class="text-end" style="width:130px">Subtotal</th><th style="width:50px"></th></tr></thead>
            <tbody id="lineas"></tbody>
            <tfoot><tr><td colspan="3" class="text-end fw-semibold">Total</td><td class="text-end fw-bold" id="totalEntrada">0.00</td><td></td></tr></tfoot>
          </table>
        </div>
        <div class="invalid-feedback d-block" id="errorLineas"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Registrar entrada</button>
      </div>
    </form>
  </div>
</div>

<template id="plantillaLinea">
  <tr class="linea">
    <td>
      <select class="form-select linea-material" name="material" required>
        <option value="">Selecciona...</option>
        {% for m in materiales %}<option value="{{ m.pk }}" data-costo="{{ m.costo_compra|stringformat:'.2f' }}" data-unidad="{{ m.get_unidad_display }}">{{ m.codigo }} - {{ m.nombre }}</option>{% endfor %}
      </select>
    </td>
    <td><div class="input-group"><input type="number" class="form-control linea-cantidad" name="cantidad" step="0.01" min="0.01" required><span class="input-group-text linea-unidad">—</span></div></td>
    <td><input type="number" class="form-control linea-costo" name="costo" step="0.01" min="0" value="0" required></td>
    <td class="text-end linea-subtotal">0.00</td>
    <td class="text-end"><button type="button" class="btn btn-sm btn-light text-danger linea-quitar" title="Quitar"><i class="bi bi-x-lg"></i></button></td>
  </tr>
</template>
