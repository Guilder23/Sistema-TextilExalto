<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" method="post" enctype="multipart/form-data" action="" id="formEditar" novalidate>
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarLabel"><i class="bi bi-pencil-square me-2"></i>Editar material</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label" for="editarCodigo">Código *</label><input class="form-control" id="editarCodigo" name="codigo" required maxlength="30"></div>
          <div class="col-md-8"><label class="form-label" for="editarNombre">Nombre *</label><input class="form-control" id="editarNombre" name="nombre" required maxlength="150"></div>
          <div class="col-md-6"><label class="form-label" for="editarCategoria">Categoría *</label>
            <select class="form-select" id="editarCategoria" name="categoria" required>
              {% for c in todas_categorias %}<option value="{{ c.pk }}">{{ c.nombre }}{% if not c.activa %} (inactiva){% endif %}</option>{% endfor %}
            </select></div>
          <div class="col-md-6"><label class="form-label" for="editarUnidad">Unidad de medida *</label>
            <select class="form-select" id="editarUnidad" name="unidad" required>{% for v, e in unidades %}<option value="{{ v }}">{{ e }}</option>{% endfor %}</select></div>
          <div class="col-md-6"><label class="form-label" for="editarStockMinimo">Stock de alerta (amarillo)</label><input type="number" step="0.01" min="0" class="form-control" id="editarStockMinimo" name="stock_minimo"><div class="form-text">Amarillo cuando el stock sea menor o igual a este valor.</div></div>
          <div class="col-md-6"><label class="form-label" for="editarStockCritico">Stock crítico (rojo)</label><input type="number" step="0.01" min="0" class="form-control" id="editarStockCritico" name="stock_critico"><div class="invalid-feedback">No puede ser mayor que el stock de alerta.</div><div class="form-text">Rojo cuando el stock sea menor o igual a este valor.</div></div>
          <div class="col-md-6"><label class="form-label" for="editarCostoCompra">Costo de compra</label><input type="number" step="0.01" min="0" class="form-control" id="editarCostoCompra" name="costo_compra"></div>
          <div class="col-md-6"><label class="form-label" for="editarPrecioVenta">Precio de venta</label><input type="number" step="0.01" min="0" class="form-control" id="editarPrecioVenta" name="precio_venta"></div>
          <div class="col-12"><label class="form-label" for="editarDescripcion">Descripción</label><textarea class="form-control" id="editarDescripcion" name="descripcion" rows="2"></textarea></div>
          <div class="col-md-6"><label class="form-label" for="editarImagen">Imagen</label><input class="form-control" type="file" id="editarImagen" name="imagen" accept="image/*"><div class="form-check mt-2 d-none" id="editarImagenEliminarContenedor"><input class="form-check-input" type="checkbox" id="editarImagenEliminar" name="imagen-clear"><label class="form-check-label" for="editarImagenEliminar">Eliminar imagen actual</label></div></div>
          <div class="col-md-6"><label class="form-label">Vista previa</label><div class="material-imagen-contenedor"><img id="editarImagenVista" class="material-imagen-forma d-none" alt="Vista previa de la imagen"><span id="editarImagenSinVista" class="text-muted small">Este material no tiene imagen.</span></div></div>
          <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="editarActivo" name="activo"><label class="form-check-label" for="editarActivo">Material activo</label></div></div>
        </div>
        <div class="form-text mt-2">Las existencias solo cambian mediante entradas y salidas.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
