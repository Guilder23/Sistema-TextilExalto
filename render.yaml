services:
  - type: web
    name: sistema-textilexalto
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn textilexalto.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-textilexalto-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "sistema-textilexalto.onrender.com,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sistema-textilexalto.onrender.com,https://*.onrender.com"
databases:
  - name: sistema-textilexalto-db
    plan: free
    databaseName: textilexalto
    user: textilexalto
